name: Bug report
description: Report an API, admin, or setup problem.
title: "Bug: "
body:
  - type: textarea
    id: reproduction
    attributes:
      label: How to reproduce
      description: Include the request, user role, and relevant setup without credentials.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
      description: Include the status code, response body, or traceback.
      render: text
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: Windows 11, Python 3.12, local SQLite
    validations:
      required: true
